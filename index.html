<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全教網資訊科技線上課程</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <h1>全教網資訊科技線上課程</h1>
    </div>
  </header>

  <main class="container">
    <div class="calendar-wrapper">
      <div class="calendar-header">
        <div class="day-name">週一 (Mon)</div>
        <div class="day-name">週二 (Tue)</div>
        <div class="day-name">週三 (Wed)</div>
        <div class="day-name">週四 (Thu)</div>
        <div class="day-name">週五 (Fri)</div>
        <div class="day-name">週六 (Sat)</div>
        <div class="day-name">週日 (Sun)</div>
      </div>
      <div class="calendar-grid" id="calendar">
        <!-- Calendar days will be generated by JS -->
      </div>
    </div>
  </main>

  <!-- Modal for course details -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
      <button class="modal-close" id="modalClose">&times;</button>
      <div class="modal-body" id="modalBody">
        <!-- Course details injected here -->
      </div>
    </div>
  </div>

  <!-- Modal for Admin Login -->
  <div class="modal-overlay" id="adminModalOverlay">
    <div class="modal-content admin-modal-content">
      <button class="modal-close" id="adminModalClose">&times;</button>
      <div class="admin-modal-body">
        <h2 class="admin-modal-title">管理員驗證</h2>
        <p class="admin-hint">使用 Google 帳號驗證管理員身分，登入後即可在課程詳細視窗中使用「加入 Notion」與「🗑️ 刪除」功能。</p>

        <div id="adminLoginError" class="admin-error" style="display: none;"></div>

        <div class="google-signin-wrapper">
          <button type="button" id="btnGoogleSignIn" class="btn-google-signin">
            <svg class="google-icon" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            使用 Google 帳號登入
          </button>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <p>made by JeffCodingMentor <button id="adminLoginTrigger" class="admin-trigger" title="管理員登入">🔒</button></p>
      <div id="adminStatusArea" class="admin-status-area" style="display: none;">
        <span class="admin-badge" id="adminUserBadge">🟢 管理員已登入</span>
        <button id="adminLogoutBtn" class="admin-logout-btn">登出</button>
      </div>
    </div>
  </footer>

  <script type="module" src="./main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全教網資訊科技線上課程</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <h1>全教網資訊科技線上課程</h1>
    </div>
  </header>

  <main class="container">
    <div class="calendar-wrapper">
      <div class="calendar-header">
        <div class="day-name">週一 (Mon)</div>
        <div class="day-name">週二 (Tue)</div>
        <div class="day-name">週三 (Wed)</div>
        <div class="day-name">週四 (Thu)</div>
        <div class="day-name">週五 (Fri)</div>
        <div class="day-name">週六 (Sat)</div>
        <div class="day-name">週日 (Sun)</div>
      </div>
      <div class="calendar-grid" id="calendar">
        <!-- Calendar days will be generated by JS -->
      </div>
    </div>
  </main>

  <!-- Modal for course details -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
      <button class="modal-close" id="modalClose">&times;</button>
      <div class="modal-body" id="modalBody">
        <!-- Course details injected here -->
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <p>made by JeffCodingMentor</p>
    </div>
  </footer>

  <script type="module" src="./main.js"></script>
</body>
</html>
